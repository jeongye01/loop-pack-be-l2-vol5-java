name: loopers-test-pg

services:
  wiremock:
    image: wiremock/wiremock:3.13.2
    ports:
      - "127.0.0.1:18089:8080"
    volumes:
      - ./wiremock/mappings:/home/wiremock/mappings:ro
      - ./wiremock/__files:/home/wiremock/__files:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
